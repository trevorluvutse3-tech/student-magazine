<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="university-header">
        <img src="my_logo.png.png" alt="Meru University Logo">
        <h1>MERU UNIVERSITY<br>OF SCIENCE AND TECHNOLOGY</h1>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Student Registration</h2>
            <form id="registerForm">
                <label>Full Name:</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
                <label>Email:</label>
                <input type="text" id="email" placeholder="Enter your email" required>
                <label>Registration Number:</label>
                <input type="text" id="regno" placeholder="Enter your registration number" required>
                <label>Password:</label>
                <input type="text" id="password" placeholder="Enter your password" required>
                <button type="submit">Create Account</button>
            </form>
            <p>Already have an account?
                    <a href="login.html">Login here</a>
                </p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
